# Dagliga jobb för wimco.se. Pages Functions har ingen egen cron, så GitHub anropar endpointerna.
# Kräver repo-hemligheten CRON_SECRET (samma värde som i Cloudflare). Saknas den hoppas jobben över.
name: Dagliga jobb

on:
  schedule:
    - cron: '17 5 * * *' # 07:17 svensk sommartid
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Påminnelser om ny analys
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "CRON_SECRET saknas, hoppar över."; exit 0; fi
          curl -fsS -X POST https://wimco.se/api/cron/reminders -H "Authorization: Bearer $CRON_SECRET"
      - name: E-handelsbevakning
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "CRON_SECRET saknas, hoppar över."; exit 0; fi
          # Varje anrop kontrollerar upp till två förfallna butiker. Tre anrop räcker för sex butiker per dag.
          for i in 1 2 3; do
            curl -fsS -m 290 -X POST https://wimco.se/api/cron/kollen -H "Authorization: Bearer $CRON_SECRET"
            echo
          done
